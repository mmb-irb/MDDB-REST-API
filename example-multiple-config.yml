# Example of a host configuration for a node which serves several hosts with a different behaviour for each
# To use it, copy this file to the repository root as config.yml
# Every host has its own configuration under 'hosts', with the host name (domain) as key
# Requests from any other host get the default configuration and are labeled as '(Unknown service)'
# Missing fields are filled with the default values (in brackets)
#
# name - Service name to be displayed in the swagger docs (MDposit)
# description - Header description to be displayed in the swagger docs (MDDB federated node server)
# accession - Accession example to be displayed in the swagger docs (A0001)
# collection - Specific collection to be targeted. Other collections will be filtered away (none)
# global - Set if it is to behave as global API instead of a local (federated) API (false)
# production - Set if projects with 'published: false' are to be hidden (true) or shown (false) (false)
# hostfix - Host to be displayed in the swagger docs instead of the requesting one (none)
# optimade - Set if the OPTIMADE API is to be mentioned in the swagger docs (true)

hosts:

    # Requests to localhost match this host, no matter the port (e.g. localhost:8000)
    localhost:
        name: My node (local)
        description: The federated node server of my lab
        accession: A0001

    my-node-dev.mddbr.eu:
        name: My node
        description: The federated node server of my lab
        accession: A0001

    my-node.mddbr.eu:
        name: My node
        description: The federated node server of my lab
        accession: A0001
        production: true
